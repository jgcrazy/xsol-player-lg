<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2c1c"/>
      <stop offset="0.55" stop-color="#1f1a16"/>
      <stop offset="1" stop-color="#0d0b0a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8b65f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#e8b65f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" gradientUnits="userSpaceOnUse" x1="0" y1="-276" x2="0" y2="-168">
      <stop offset="0" stop-color="#f6d08a"/>
      <stop offset="1" stop-color="#e8b65f"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9cbdb"/>
      <stop offset="1" stop-color="#7fa6ba"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="436" fill="none" stroke="#a87f3a" stroke-opacity="0.55" stroke-width="8"/>

  <g transform="translate(512 400)">
    <circle r="330" fill="url(#halo)"/>

    <!-- 16 spokes at 22.5deg; the four diagonals are left to the X stroke. -->
    <g stroke="url(#ray)" stroke-width="26" stroke-linecap="round">
      <line y1="-168" y2="-276"/>
      <line y1="-168" y2="-276" transform="rotate(22.5)"/>
      <line y1="-168" y2="-276" transform="rotate(67.5)"/>
      <line y1="-168" y2="-276" transform="rotate(90)"/>
      <line y1="-168" y2="-276" transform="rotate(112.5)"/>
      <line y1="-168" y2="-276" transform="rotate(157.5)"/>
      <line y1="-168" y2="-276" transform="rotate(180)"/>
      <line y1="-168" y2="-276" transform="rotate(202.5)"/>
      <line y1="-168" y2="-276" transform="rotate(247.5)"/>
      <line y1="-168" y2="-276" transform="rotate(270)"/>
      <line y1="-168" y2="-276" transform="rotate(292.5)"/>
      <line y1="-168" y2="-276" transform="rotate(337.5)"/>
    </g>

    <g stroke="#f2ece2" stroke-width="44" stroke-linecap="round">
      <line y1="-128" y2="-300" transform="rotate(-45)"/>
      <line y1="-128" y2="-300" transform="rotate(135)"/>
    </g>

    <path d="M-52 -84 L92 0 L-52 84 Z" fill="url(#play)" stroke="url(#play)"
          stroke-width="26" stroke-linejoin="round"/>
  </g>

  <text x="512" y="842" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="104" font-weight="600" letter-spacing="2"><tspan fill="#f2ece2">XSol</tspan><tspan fill="#e8b65f"> Player</tspan></text>
</svg>
